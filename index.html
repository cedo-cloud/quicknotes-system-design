<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes API Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
    </header>

    <main>
        <p id="status"></p>
        
        <button id="load-btn">Load Notes</button>

        <h2>Create a Note</h2>
        <form id="note-form">
            <label for="title-input">Title (Max 100 chars):</label>
            <input type="text" id="title-input" name="title" required>
            
            <label for="body-input">Body (Optional):</label>
            <textarea id="body-input" name="body" rows="4"></textarea>
            
            <button type="submit" id="submit-btn">Submit Note</button>
        </form>

        <h2>Notes List</h2>
        <ul id="notes-list"></ul>
    </main>

    <script src="api.js" defer></script>
</body>
</html>
